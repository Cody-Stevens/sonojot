[package]
name = "sonojot-mobile"
version = "0.2.0"
description = "SonoJot offline speech recognition for Android and iOS: audio gating, sherpa-onnx runner, model packs and transcript cleanup"
authors = ["Cody Stevens Studio"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.85"
publish = false

# Standalone: neither part of the desktop app's build nor of a parent workspace.
[workspace]

[lib]
name = "sonojot_mobile"
# rlib for Rust callers and tests, cdylib for Android (libsonojot_mobile.so), staticlib for iOS.
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
# Same pins as rewrite/src-tauri, whose asr_filter.rs and written_form compile here unchanged.
nnnoiseless = { version = "=0.5.2", default-features = false }
libloading = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"

[dev-dependencies]
hound = "3.5"

[lints.rust]
# The shared desktop modules gate evaluation-only code on this feature; it is never enabled here.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("fidelity-eval"))'] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = "debuginfo"
# The C ABI catches panics at every entry point; unwinding must stay available for that.
panic = "unwind"
